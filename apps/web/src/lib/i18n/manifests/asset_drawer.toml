# Asset Drawer i18n manifest — strings du panneau latéral maps & armes.
# Format : ICU MessageFormat (cf. PLAN_META_FOUNDATIONS_GO § 3.4).
#
# Pour ajouter une clé :
#   1. Définir [asset_drawer.section.subkey] avec fr et en
#   2. Lancer `node apps/web/scripts/build_i18n_manifests.mjs` pour
#      régénérer le module TS dans lib/i18n/generated/

[asset_drawer.mini_tab]
en = "References"

[asset_drawer.tab.maps]
en = "Maps"

[asset_drawer.tab.weapons]
en = "Weapons"

[asset_drawer.tab.medals]
en = "Medals"

[asset_drawer.search.placeholder]
en = "Search…"

[asset_drawer.empty.maps]
en = "No map found."

[asset_drawer.empty.weapons]
en = "No weapon found."

[asset_drawer.empty.medals]
en = "No medal found."

[asset_drawer.empty.loading]
en = "Loading…"

[asset_drawer.empty.error]
en = "Loading error."

[asset_drawer.toggle.open]
en = "Open visual reference"

[asset_drawer.toggle.close]
en = "Close visual reference"
