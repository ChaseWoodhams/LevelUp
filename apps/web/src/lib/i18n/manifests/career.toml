# Career i18n manifest — strings de la page Carriere.
#
# Format ICU MessageFormat. Regenerer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Phase 2 meta-plan § 6.2.1 — pilote Career. Couvre :
#   career.summary.*       Summary card (rang + XP)
#   career.charts.*        Titres + axes des charts ECharts
#   career.top_matches.*   Section top matchs
#   career.encounters.*    Section rencontres frequentes
#   career.citations.*     Onglet Citations
#   career.empty.*         Etats vides
#   career.errors.*        Etats d'erreur

