# ─── Charts (titres + axes) ────────────────────────────────────────────────

[career.charts.rank_progress]
en = "Rank progress"

# Libellé « progression vers le rang max » avec le NOM du rang sommet interpolé
# ({rank} = « Héros » Halo Infinite, « SR 152 » Halo 5, résolu par le titre). Le
# vocabulaire du rang max n'est jamais codé en dur : il vient du payload/catalogue.
[career.charts.max_rank_progress]
en = "Progress to {rank}"

# Repli générique du nom de rang max quand la source ne le fournit pas (titre sans
# catalogue de rangs, dégradation) — interpolé dans max_rank_progress.
[career.charts.max_rank_generic]
en = "max rank"

[career.charts.xp_history_title]
en = "XP history"

[career.charts.xp_history_axis_y]
en = "Cumulative XP"

# Libellés courts du type de courbe dans le tooltip XP (real/estimated/optimistic).
# `proj-normal` n'a pas d'entrée ici : son libellé est le nom du rang max résolu
# dynamiquement (title-agnostic, cf. max_rank_generic) — jamais ces 3 clés.
[career.charts.xp_type_real]
en = "actual"

[career.charts.xp_type_estimated]
en = "estimated"

[career.charts.xp_type_optimistic]
en = "optimistic"

[career.charts.lusr_rating_title]
en = "LUSR rating"

[career.charts.lusr_rating_axis_y]
en = "LUSR"

[career.charts.placeholder_unavailable]
en = "Chart unavailable"

[career.charts.placeholder_description]
en = "The career view returned no exploitable data for this section."

