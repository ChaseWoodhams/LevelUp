# Coaching tips i18n manifest — conseils concrets Halo Infinite par axe.
#
# Format ICU MessageFormat (aligné sur les autres manifests). Regénérer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Structure : 6 axes du radar narrative (cf. internal/analysis/narrative/participation.go)
#   - title             : libellé axe
#   - related_signals   : indicateurs qualitatifs (aide à l'interprétation,
#                         pas un mapping technique vers performance_score.go)
#   - ingame.N          : mécanique pure (compétences de base, scoring,
#                         comportement du jeu lui-même)
#   - tactical.N        : décisions à l'engagement (échelle seconde / duel /
#                         situation immédiate)
#   - strategic.N       : décisions macro (échelle match / carte / mode /
#                         équipe / score adverse)
#   - settings.N        : paramètres (sensi, FOV, audio, bindings) — pas de
#                         valeurs absolues inventées, direction du curseur
#   - routine.N         : méta (entraînement, revue, structure de session)
#
# Cible : intégration future dans le coach proactif V2
#   (cf. .ai/PLAN_PROGRESSION_TRACKING_ASCENSION.md §6).
#
# Sources de référence :
#   - thegamer.com, sirusgaming.com, gamerant.com, retbit.com (guides
#     beginner / settings vérifiés via WebFetch).
#   - 7 threads Reddit fournis par l'utilisateur, sauvegardés localement et
#     extraits : r/CompetitiveHalo « Fundamentals », « Getting Good »,
#     r/halo « Tips », « how can i get better », r/haloinfinite « Tips for
#     a multiplayer noob », « New to Halo multiplayer ». Inclut pépites
#     Onyx (Marathon RB CSR 1658, THEFuentes, autres D5-D6).
#
# Règles éditoriales :
#   - pas de termes anglais quand un équivalent français existe
#   - pas de valeurs chiffrées inventées (sensibilité, FOV, %, etc.)
#   - pas de suppositions sur des fonctionnalités du jeu non vérifiées
#   - mécaniques de jeu citées : vérifiées via sources ci-dessus

# ─── Combat ────────────────────────────────────────────────────────────────

[coaching_tips.combat.title]
en = "Combat"

[coaching_tips.combat.related_signals]
en = "Clean shots, accuracy, duel finishing, marksman medals"

[coaching_tips.combat.ingame.1]
en = "Memorize how many clean shots each weapon needs to crack shields then finish, body or headshot: Battle Rifle, Commando, Bandit, Sidekick, Plasma Pistol. Knowing this number changes every duel — you know when to push, fall back, or switch weapons."

[coaching_tips.combat.ingame.2]
en = "Damage types follow a simple logic: UNSC kinetic (BR, Commando, Bandit) is weak vs shield but strong vs health; plasma (overcharged Plasma Pistol, Pulse Carbine) is strong vs shield but weak vs health; Forerunner / hard-light weapons deal equal damage."

[coaching_tips.combat.ingame.3]
en = "As long as the enemy shield is intact, a headshot deals the exact same damage as a body shot. Aim center mass while shields hold (easier to hit), then switch to headshot the moment shields break for the instant finish. Saves bullets, speeds up the kill."

[coaching_tips.combat.ingame.4]
en = "Halo Infinite is a left-stick aim game: guide your crosshair onto the target with Spartan movement (left), and use the right stick only for micro-adjustments. It's the opposite of the CoD instinct — any Onyx player will tell you. Strafing feeds your aim."

[coaching_tips.combat.ingame.5]
en = "Unbeatable combo: overcharged Plasma Pistol to crack the shield, then immediately swap to BR or Sidekick headshot to finish. It's the plasma-vs-shield, kinetic-vs-health logic applied directly."

[coaching_tips.combat.tactical.1]
en = "Pre-engage with the right weapon: Battle Rifle / Commando at mid-range, Sidekick / Bulldog up close, Needler or overcharged Plasma Pistol + Sidekick combo to dump a duel. Pulling the wrong weapon loses the duel before the first shot."

[coaching_tips.combat.tactical.2]
en = "Don't blindly chase a fleeing wounded enemy. Nine times out of ten he's pulling you onto a teammate, an Overshield, or a power weapon — or grenading the corner. Reload, reposition, re-engage with the advantage."

[coaching_tips.combat.tactical.3]
en = "Don't jump in gunfights. It's the strongest consensus in the competitive community: jumping cuts your aim assist, makes your trajectory predictable, and loses duels to any precision player (BR, Sniper). Wide irregular strafe is enough — save jumps for rotations and escape clambers."

[coaching_tips.combat.tactical.4]
en = "Don't ADS by default. On automatics and precision weapons at short/mid range, scoping doesn't change spread or magnetism — it just slightly lowers your aim sensitivity. Hipfire in close duels, scope only for long-range shots."

[coaching_tips.combat.tactical.5]
en = "Grenades are only live after their first bounce on the ground. Throw them before the engagement (to land in the enemy's retreat zone) or after (to finish a wounded hidden target), never during — mid-fight you're just taking your hand off the aim."

[coaching_tips.combat.tactical.6]
en = "Exploit elevation: shooting downward is easier than shooting upward (vertical aim assist works better downward), and a step back puts you in cover instantly. Shooting upward at 45° is harder than full vertical due to magnetism. Hunt the high ground every chance."

[coaching_tips.combat.tactical.7]
en = "Finish with a headshot when the weapon allows it (Sidekick, Bandit, Battle Rifle on the second-to-last burst then transition). Once shields break, a headshot turns a 4-burst duel into a 3-burst duel."

[coaching_tips.combat.tactical.8]
en = "Pro nuance on strafing: strafe wide to force the opponent's right-stick use (breaks their aim), but stop on the final shot. Pros (like Formal) often stand still for the finishing headshot — your own strafe costs you precision too."

[coaching_tips.combat.strategic.1]
en = "Identify the enemy top fragger in the first 2 minutes: which weapon, which angle. Your team must then deny him first — either denying his preferred weapon or pre-aiming his favorite angle. Breaking the enemy #1 is worth 3 kills on others."

[coaching_tips.combat.strategic.2]
en = "Match your rhythm to the mode: BTB demands patience and long positioning, 4v4 Arena demands speed and weapon switching, Ranked demands discipline (no unnecessary risk-taking). Playing Arena like BTB loses every duel."

[coaching_tips.combat.strategic.3]
en = "Your offensive conversion measures how many kills and assists you earn per point of damage dealt. « Precise » style (high conversion) = you finish your own duels efficiently; « generous » style (low conversion) = you create pressure and damage that teammates convert into kills."

[coaching_tips.combat.strategic.4]
en = "Precise or generous offensive style, both are assets: precise maximizes individual impact, generous works best in teams that team-shot well. If you're « generous » in solo queue, working on your duel-finishing is more profitable than increasing raw damage volume."

[coaching_tips.combat.settings.1]
en = "Configure deadzones first, before anything else (sensi, FOV). Reduce inner deadzone until the stick responds to the smallest move without drifting. No universal value, only trial — the goal is to nudge aim by half a pixel."

[coaching_tips.combat.settings.2]
en = "Increase the field of view as long as distant targets remain readable. The more you see, the faster you react to a flank or a teammate in trouble. Lock in your comfort value and stop tweaking."

[coaching_tips.combat.settings.3]
en = "Disable motion blur, screen shake, and speed lines. These cosmetic effects hide enemies during explosions and can be confused with incoming fire. Max out reticle outline thickness and opacity — clearly seeing your crosshair beats immersion."

[coaching_tips.combat.routine.1]
en = "Before each session, do a few minutes of Academy weapon drills, or a Custom Game vs Spartan-difficulty bots with one forced weapon. The Bot Bootcamp playlist is gone, but both these modes still allow training."

[coaching_tips.combat.routine.2]
en = "To seriously boost your aim: create a Custom Game on Octagon (community map, infinite ammo, instant respawn) with 3-4 Spartan bots, NEVER Sniper as primary (bots use it like an aimbot). 20 minutes of Octagon ≈ 2 hours of Arena in duel reps."

[coaching_tips.combat.routine.3]
en = "Recommended Octagon training variant: the HCS 2042 version (randomized spawns + ledges to practice curb slides), to vary angles and add movement to your duel reps."

# ─── Survie ────────────────────────────────────────────────────────────────

[coaching_tips.survival.title]
en = "Survival"

[coaching_tips.survival.related_signals]
en = "Deaths avoided, expected-vs-actual deaths, damage taken per death"

[coaching_tips.survival.ingame.1]
en = "The radar is your main info resource, especially on small maps. Glance at it several times per second, not only when you're safe. A red dot at 5m you missed = your next death."

[coaching_tips.survival.tactical.1]
en = "Shields broken = break line of sight before the next shot. Lateral jump, corner, clamber — anything, but never reload in the open. A Sidekick does less damage than a Spartan watching you reload."

[coaching_tips.survival.tactical.2]
en = "Sprint is a beginner trap: it puts you on the enemy radar, and there's roughly a half-second transition delay before you can shoot after sprinting. Disable auto-sprint. Approach duel corners walking and pre-aiming — you arrive stealthy with crosshair already placed."

[coaching_tips.survival.tactical.3]
en = "Peek from the right side of a wall when possible: your Spartan holds the weapon on the right, so you see the enemy before he sees you. Peeking from the left = reverse, you get seen first. Pro detail often missed by mainstream guides."

[coaching_tips.survival.tactical.4]
en = "Identify one-shot threats: Skewer (one body shot kills), Sniper (headshot), Shock Rifle (headshot), Gravity Hammer and Energy Sword (melee), exploding Fusion Coils. The moment you hear or see one, break line of sight immediately and callout to your team."

[coaching_tips.survival.tactical.5]
en = "Don't engage without at least two advantages: Overshield + teammate, Repulsor + Sniper, Bulldog + Thruster, elevation + favored weapon, etc. If you find yourself in a 1v1 with equal shield and equal weapon, you made a positioning error upstream — the duel is a coin flip."

[coaching_tips.survival.tactical.6]
en = "Use defensive equipment systematically: Repulsor on a projectile (rocket, skewer, mid-air grenade), Drop Wall to break line of sight — but careful, a Drop Wall can be destroyed by shooting its base. Grappleshot to disengage from a losing duel. Equipment hoarded and dying with you is wasted."

[coaching_tips.survival.tactical.7]
en = "When you know you're about to die, throw all your grenades: at your feet (post-mortem area denial), sticky on the enemy, or down the enemy lane. Revenge kill rate is surprisingly high, and even a miss denies the area for a few seconds."

[coaching_tips.survival.tactical.8]
en = "After a death, don't re-push your killer. Sit still a few seconds, check the radar, pick a new engagement vector. Revenge pushing is the #1 cause of death streaks."

[coaching_tips.survival.strategic.1]
en = "If you're carrying a power weapon (Rocket Launcher, Sniper, Skewer), your top priority flips: no more seeking kills, just survive to keep it. Dying hands the weapon to the enemy and flips the match dynamic."

[coaching_tips.survival.strategic.2]
en = "« Knowing numbers »: never push without knowing how many enemies you might meet. Count death X's in the feed, team markers, radar. If their team is all-up and yours is staggered, fall back. If three of theirs just died, push the objective. Numerical discipline separates Diamond from Onyx."

[coaching_tips.survival.strategic.3]
en = "When two teammates fall in the same spot within seconds, change lanes. Don't be the third X: flank, or fall back to a power-weapon spawn or power-up. Reading the death pattern is a strategic skill."

[coaching_tips.survival.strategic.4]
en = "Low damage taken is not always a good signal — context is everything. High damage taken + few deaths = you're absorbing team aggro while surviving, the high-impact profile. Low damage + few deaths = you're avoiding fights, and if your team is losing meanwhile, you haven't pulled your weight."

[coaching_tips.survival.strategic.5]
en = "To judge your survival, don't look at raw damage taken but at your defensive resistance on LevelUp: it measures the ratio of hits received to deaths — the only number that separates « absorbing aggro while surviving » from « avoiding fights »."

[coaching_tips.survival.settings.1]
en = "Audio on headphones, effects priority over music: hearing footsteps, reloads, Overshield triggers, grapple sounds changes how you read every fight."

[coaching_tips.survival.settings.2]
en = "Switch audio mode to « Compressed »: it raises the volume of quiet sounds (footsteps, soft reloads). Reduce environmental effects to distinguish player sounds from ambient noise."

[coaching_tips.survival.routine.1]
en = "On every other match, force yourself never to re-push your direct killer. After a few sessions, check your deaths per match on the Synthesis page: the drop is measurable."

# ─── Support ───────────────────────────────────────────────────────────────

[coaching_tips.support.title]
en = "Support"

[coaching_tips.support.related_signals]
en = "Assists, damage leading to teammate kills, crossfire presence, mark assist kills"

[coaching_tips.support.tactical.1]
en = "If a teammate is dueling in your line of sight and you can land one shot, take it even if you were going elsewhere. One shot turns his 1v1 into a 2v1 — that's the textbook Halo crossfire advantage."

[coaching_tips.support.tactical.2]
en = "Stay within sight of a teammate as much as possible. A lone Spartan almost always loses a duel, a crossfire duo almost always wins — combat geometry beats aim."

[coaching_tips.support.tactical.3]
en = "Halo Infinite has two distinct info commands — the first title in the series to ship them. Marker / ping to point out an enemy, weapon, or pressure point to your team. AI scan to temporarily reveal weapons, equipment, and teammates around you. Spam the ping, use the scan when hunting power weapons or equipment."

[coaching_tips.support.tactical.4]
en = "Above every power-weapon rack, a blue bar shows time to respawn. Always callout the timer to your team (« Sniper in 15 »). It's the most actionable info of the match — it triggers winning rotations."

[coaching_tips.support.strategic.1]
en = "Learn to use the Threat Sensor: dropped on a pressure point (lane to a Strongholds zone, power-weapon room, enemy flag), it gives your whole team perfect enemy position read for several seconds — automatic area marking."

[coaching_tips.support.strategic.2]
en = "In a stack, distribute roles early: one player always takes the Sniper, one holds the zone, a third floats on power weapons and power-ups. Four Spartans doing the same thing get in each other's way; four Spartans in complementary roles control the map."

[coaching_tips.support.settings.1]
en = "Bind both mark and scan commands to buttons reachable without lifting your aim-stick thumb. If they're on awkward combos, you won't use them in a duel — exactly when team info matters most."

[coaching_tips.support.routine.1]
en = "Play 1 in 3 matches in voice party, even with strangers. Your ear learns callouts (« Sniper top », « Rocket in 10 », « I flank from S2 »), and those reflexes carry over to solo play."

[coaching_tips.support.routine.2]
en = "Set a measurable support goal: at least one mark-assist kill per match. If you finish a game with none, that's the first reflex to fix next game."

# ─── Score ─────────────────────────────────────────────────────────────────

[coaching_tips.score.title]
en = "Score"

[coaching_tips.score.related_signals]
en = "Personal score per minute, medal exploit, damage per minute"

[coaching_tips.score.ingame.1]
en = "Halo rewards variety, not volume. A match with multi-kills, killing sprees, headshots, and power-weapon finishes scores more than a match with twice as many kills but all Assault Rifle body shots."

[coaching_tips.score.strategic.1]
en = "When a power weapon spawns (Rocket Launcher, Sniper, Skewer, Energy Sword, Gravity Hammer, Cindershot, Ravager for area denial), go get it or make sure it doesn't fall in enemy hands. Each power-weapon kill is worth far more in medals — and each denial protects your collective score."

[coaching_tips.score.strategic.2]
en = "In objective modes (Strongholds, CTF, Oddball), personal score includes objective actions (capture, escort, hold). If you mentally play the mode like Slayer, you leave half your score on the table — pure math."

[coaching_tips.score.routine.1]
en = "After each session, check your personal score per minute on the Synthesis page. If you're playing an objective mode and this number is flat, your mindset is still Slayer — fix it before next session."

[coaching_tips.score.routine.2]
en = "To learn the weapon sandbox without rank pressure, play Fiesta (random loadouts across the whole arsenal) or Husky Raid (packed teams on a small map, every weapon shows up). After 10 matches you'll have better « which weapon in which hand » instinct than after 50 Slayer games."

# ─── Objectif ──────────────────────────────────────────────────────────────

[coaching_tips.objective.title]
en = "Objective"

[coaching_tips.objective.related_signals]
en = "Captures, hold time, escorts, objective-linked score"

[coaching_tips.objective.strategic.1]
en = "Strongholds: the first capture dictates the whole match rhythm. Run to the neutral zone from spawn rather than seeking a kill, even if you get shot — a captured zone is worth more than an avoided death."

[coaching_tips.objective.strategic.2]
en = "Strongholds — the best hold is A+B (the closest pair, defenses overlap). If you're stuck and can't break B, fall back to A+C: you keep score ticking, regain momentum, then push B with an Overshield or power weapons. A+C fallback beats dying 5 times on B."

[coaching_tips.objective.strategic.3]
en = "CTF / Capture the Flag: you don't have to be the carrier. Escorting, clearing a lane, killing chasers is worth as much as a carry. A carrier without escort dies halfway, two escorts without a carrier never score. And don't pull the flag when their team is all-up — that's losing solo play."

[coaching_tips.objective.strategic.4]
en = "Oddball: carry the skull in short bursts then pass to a better-positioned teammate. A solo carry that dies breaks the chain and hands the skull over; two alternating carriers hold indefinitely. Stay elevated with your teammates to control spawns."

[coaching_tips.objective.strategic.5]
en = "Oddball trick: if you're surrounded with no escape, deliberately jump off the map to suicide. The skull resets to the neutral spawn instead of being picked up by the pressing enemy. It's a tempo concession that saves a round."

[coaching_tips.objective.strategic.6]
en = "Snowball management: if you're leading by a lot, play passive and control power-ups (Overshield, Active Camo, power weapons) to prevent comebacks; if you're trailing, force a stack on a decisive kill or a coordinated objective push. Rhythm must change with the score."

[coaching_tips.objective.strategic.7]
en = "Learn mode-specific timings and lanes on each map: where the flag respawns, which Strongholds zone is most contested, where the Oddball carrier hides late game. Objective modes are positional games before they're shooters."

[coaching_tips.objective.routine.1]
en = "If you often play objective modes but never finish high on your team's « Objective Score » board, your instinct pulls you toward Slayer. Consciously force yourself to touch the objective at least once per minute."

# ─── Impact ────────────────────────────────────────────────────────────────

[coaching_tips.impact.title]
en = "Impact"

[coaching_tips.impact.related_signals]
en = "K/D/A ratio, kills vs stronger opponents, decisive moments"

[coaching_tips.impact.tactical.1]
en = "Late round or last teammate alive, switch to patient mode. Clutches aren't won through aggression but through sound reading, patience, and defensive positioning. Let the enemy come find you — he'll make the mistake first."

[coaching_tips.impact.tactical.2]
en = "When a teammate dies next to you, don't always flee — if the enemy's shield is cracked and you can trade the kill, take it. A trade (1 for 1) is neutral, but it breaks the enemy killing-spree combo and resets the fight."

[coaching_tips.impact.tactical.3]
en = "Overshield and power-ups: pop the Overshield IMMEDIATELY when you grab it, otherwise you die with it and hand it over. Exception: Active Camo, which you can stretch by activating right as you leave its spawn area, avoiding revealing your pickup position."

[coaching_tips.impact.strategic.1]
en = "Map control > kills: at every respawn, don't ask « where do I get a kill? » but « where do I need to be for my team to control the map? ». A dead enemy in 10 seconds doesn't matter if you handed Overshield to the enemy camp. The killboard reflects the consequence, not the goal."

[coaching_tips.impact.strategic.2]
en = "Power weapons and map power-ups (Overshield, Active Camo) win matches. Learn their spawn timing on each map (visible on the blue bar above weapon racks): either you grab them, or you deny the enemy — denial is worth as much as a kill."

[coaching_tips.impact.strategic.3]
en = "A Spartan with Overshield or Active Camo is worth two normal Spartans. When a power-up is about to spawn, your team must make it top priority — even if it means giving up a Strongholds zone for ten seconds to make sure it doesn't go to the enemy."

[coaching_tips.impact.strategic.4]
en = "Onyx insight: distinguish « presence » (impact by forcing flanks, contestations, enemy rotations) from « control » (zones held with overlapping angles). Stat-padding in a rat tunnel creates neither presence nor control, even if KD climbs. Play to force enemy decisions, not to grind consequence-free kills."

[coaching_tips.impact.strategic.5]
en = "Take the time to learn the map: community callouts, shortcuts (clamber, slide, side jumps that save seconds), angles where you see without being seen, power-weapon spawn positions. Map knowledge beats aim at high level."

[coaching_tips.impact.strategic.10]
en = "Learn « curb slides »: sprint from a small ledge then crouch on landing for a big speed boost. These fast movements win your rotations to power weapons and map power-ups."

[coaching_tips.impact.strategic.6]
en = "See each match as a series of key moments (power-weapon spawn, score swing, final round). These moments matter more than the match average. Recognizing you're in a key moment lets you raise your focus exactly when it counts."

[coaching_tips.impact.strategic.7]
en = "BTB only: the Grappleshot can launch you into an enemy vehicle and eject the pilot. Keep this vehicle hijack in mind when a Mongoose, Warthog, or Wasp passes within range — it's an instant tempo and team-score reversal."

[coaching_tips.impact.strategic.8]
en = "In Halo Infinite, damage dealt per match predicts winning better than K/D: the kill-trading structure (two equally healthy players often kill each other) makes K/D noisy. A match at 5,000 damage with a 0.9 K/D often contributes more than 3,500 damage with a 1.3 K/D."

[coaching_tips.impact.strategic.9]
en = "Practical takeaway: on the Synthesis page, track your average damage per match first, not your K/D. K/D will improve on its own once your positioning and duel-finishing get better."

[coaching_tips.impact.settings.1]
en = "If you regularly miss clutch shots, try turning off controller vibration. Kinesthetic noise disturbs micro-precision when your hands are already tense."

[coaching_tips.impact.routine.1]
en = "Once a week, review one of your best sequences on the Match page. Don't limit yourself to your own POV — also watch from a teammate's POV to understand what was happening while you played."

[coaching_tips.impact.routine.2]
en = "When you review a sequence, identify one repeatable detail (positioning, weapon choice, grapple timing) and try to reproduce it next session. Progress comes from conscious repetition, not passive watching."
