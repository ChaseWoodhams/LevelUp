[common.charts.efficiency_tooltip]
en = "Output = offensive efficiency: how well damage is turned into kills. Resistance = defensive resilience: how much damage is absorbed before dying. Both curves are expressed as a percentage of one life: 100% equals one full life, about {{HP}} points of damage in the displayed title — each chart's reference line marks that level. Above 100%, performance exceeds one life (output: a kill costs less than one life of damage; resistance: more than one life is absorbed before death); below it, performance stays under that level. Hovering over a point reveals the raw damage value behind the percentage."

# Aide pédagogique UNIQUE du graphe « Écart cumulé au FDA attendu » (Séries
# temporelles + Sessions) : le graphe n'en avait aucune. Langage simple, pas de
# vocabulaire statistique — l'important est la PENTE, pas la valeur absolue.
[common.charts.fda_gap_tooltip]
en = "For every match, actual KDA is compared to the KDA expected against that opposition. The line adds up those gaps match after match: it rises when performance beats expectations and falls when it falls short. Watch its slope above all — above the 0 line performance is ahead of expectations, below it it is behind. The thin dashed line is each match's expected KDA."

# Axes du profil « Intensité » (Escouade / Séries temporelles / Sessions). L'axe X
# ne montre que 3 repères (début / milieu / fin du match) ; rangeSuffix complète la
# tranche dans le tooltip (ex. « 40-50% du match »).
[common.charts.intensity_axis_start]
en = "Start"

[common.charts.intensity_axis_mid]
en = "Midpoint"

[common.charts.intensity_axis_end]
en = "End"

[common.charts.intensity_axis_range_suffix]
en = "of the match"

