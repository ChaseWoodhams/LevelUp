# ─── Glossaire applicatif ───────────────────────────────────────────────────

[engagement.glossary.title]
en = "Engagement"

[engagement.glossary.definition]
en = "Measures dynamism in a match: gap between observed engagement and expected engagement (based on historical style and team context), normalized as a percentile vs the player's own history. 50 = as usual. >50 = more engaged. <50 = less engaged."

[engagement.glossary.skill_vs_engagement]
en = "Distinct from the Performance Score: PerfScore measures the quality of actions, Engagement measures their quantity, regularity and state of mind. The two axes are independent."

[engagement.glossary.coef_explanation]
en = "Expected engagement is lobby-anchored: the USUAL response in a match of similar intensity (calm / standard / chaotic). A low « Player (expected) » curve vs the actual team reflects a structural trait; the actual - expected gap reflects the form on the day."

