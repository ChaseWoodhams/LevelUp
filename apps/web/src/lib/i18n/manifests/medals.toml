# Medals i18n manifest — strings de la page Médailles (sous-page Carrière).
#
# Format ICU MessageFormat. Regenerer via :
#   node apps/web/scripts/build_i18n_manifests.mjs
#
# Les cles de categorie / super-section / rarete sont les CLES STABLES emises par
# le backend (POST /pages/medals). Le rendu est title-agnostic : une cle inconnue
# (medal_type d'un futur titre) retombe sur la cle brute cote front (labels.ts).
# Terminologie FR canonique reutilisee de l'app (asset_labels_fr) pour les modes
# Halo : « Capture du drapeau », « Corps a corps », « Tireur d'elite », « Reserve ».

[medals.header.title]
en = "Medals — {earned}/{total} earned"

# ─── Barre de filtre (obtenues / non-obtenues / toutes) ──────────────────────

[medals.filter.label]
en = "Display"

[medals.filter.all]
en = "All"

[medals.filter.obtained]
en = "Earned"

[medals.filter.not_obtained]
en = "Not earned"

# ─── Tri ─────────────────────────────────────────────────────────────────────

[medals.sort.label]
en = "Sort by"

[medals.sort.category_total]
en = "Category total"

[medals.sort.medal_count]
en = "Medal count"

[medals.sort.medal_name]
en = "Medal name"

# ─── En-tête de catégorie ────────────────────────────────────────────────────

[medals.category.mastery]
en = "{earned}/{total} earned"

[medals.category.total_awarded]
en = "{count} total"

# ─── Carte médaille ──────────────────────────────────────────────────────────

[medals.card.never_earned_aria]
en = "Never earned"

[medals.card.earned_aria]
en = "Earned {count, plural, one {# time} other {# times}}"

# ─── États transverses ───────────────────────────────────────────────────────

[medals.errors.load_failed]
en = "Failed to load medals"

[medals.errors.retry]
en = "Retry"

[medals.empty.no_data]
en = "Medals unavailable"

[medals.empty.no_data_description]
en = "No exploitable response returned for this page."

[medals.empty.no_items]
en = "No medal to display"

[medals.empty.no_items_description]
en = "No medal matches the selected filter."

# ─── Super-sections (regroupement SpartanRecord — Halo Infinite) ─────────────

[medals.super_section.classics]
en = "Classics"

[medals.super_section.game_modes]
en = "Game modes"

[medals.super_section.weapons_equipment]
en = "Weapons & equipment"

[medals.super_section.other]
en = "Other"

# ─── Catégories ──────────────────────────────────────────────────────────────
# 23 categories SpartanRecord (Halo Infinite) + 3 baseline medal_type
# (mode / proficiency / style) servant les titres sans enrichissement +
# 3 categories Halo 5 (referentiel wiki halo.fr : warzone / strongholds / objective ;
# les autres cles H5 — multikill/spree/weapons/vehicles/infection/ctf/oddball/style —
# reutilisent les cles Infinite ci-dessus).

[medals.category.spree]
en = "Spree"

[medals.category.multikill]
en = "Multikill"

[medals.category.assault]
en = "Assault"

[medals.category.ctf]
en = "Capture the Flag"

[medals.category.infection]
en = "Infection"

[medals.category.elimination]
en = "Elimination"

[medals.category.extraction]
en = "Extraction"

[medals.category.juggernaut]
en = "Juggernaut"

[medals.category.king_of_the_hill]
en = "King of the Hill"

[medals.category.oddball]
en = "Oddball"

[medals.category.stockpile]
en = "Stockpile"

[medals.category.vip]
en = "VIP"

[medals.category.zone]
en = "Zones"

# Categories specifiques Halo 5 (referentiel wiki halo.fr). « Warzone » et
# « Bastions » sont les noms officiels FR des modes ; « Objectif » regroupe les
# medailles d'objectif transverses (multi-captures, interceptions, immortalite…).

[medals.category.warzone]
en = "Warzone"

[medals.category.strongholds]
en = "Strongholds"

[medals.category.objective]
en = "Objective"

[medals.category.boom]
en = "Boom"

[medals.category.equipment]
en = "Equipment"

[medals.category.melee]
en = "Melee"

[medals.category.sniper]
en = "Sniper"

[medals.category.weapons]
en = "Weapons"

[medals.category.vehicles]
en = "Vehicles"

[medals.category.assists]
en = "Assists"

[medals.category.game_end]
en = "Game end"

[medals.category.skill]
en = "Skill"

[medals.category.other]
en = "Other"

[medals.category.mode]
en = "Mode"

[medals.category.proficiency]
en = "Proficiency"

[medals.category.style]
