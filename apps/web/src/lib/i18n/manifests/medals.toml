# ─── Raretés (Halo Infinite — index de difficulté 0..3) ──────────────────────
# Accord feminin (« une medaille ») : Normale / Heroique / Legendaire / Mythique.

[medals.rarity.normal]
en = "Normal"

[medals.rarity.heroic]
en = "Heroic"

[medals.rarity.legendary]
en = "Legendary"

[medals.rarity.mythic]
en = "Mythic"
