# config/titles/halo_5/mappings/fields.toml
#
# Source de vérité des FieldKey canoniques pour Halo 5. SOUS-ENSEMBLE PAR CAPABILITY
# (F6, décision 2026-07-04) : tous les groupes exposés (combat/match/career/skill/
# derived) ; les 7 champs PvE/Firefight sont EXCLUS (modèle Warzone Firefight distinct,
# pve.firefight_stats=not_exposed). Libellés/unités = canoniques Halo (mêmes qu'Infinite).
#
# Convention : sections indexées par FieldKey canonique (cf. canonical/fields.go).
# Une section absente = le titre ne supporte pas ce champ pour les surfaces produit.
#
# Champs obligatoires : labels.en, labels.en, storage_unit, display_unit,
# format, display_order, group.
# Champs optionnels : description (en+fr conjointement), icon.
#
# Toute modification breaking incrémente schema_version (cf. tools/mappings/CHANGELOG.md).

[meta]
title_slug     = "halo_5"
schema_version = 1

