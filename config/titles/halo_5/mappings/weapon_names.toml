# config/titles/halo_5/mappings/weapon_names.toml
#
# SOURCE UNIQUE des noms d'armes affiches Halo 5: Guardians (V72-06). Keye par
# weapon_key (identifiant canonique stable du registre weapons/weapon_ids), PAS par
# le nom EN brut de l'API Metadata (qui varie en casse/espaces : "FRAG GRENADE",
# "LightRifle" — d'ou l'ancien mismatch qui laissait fuir l'anglais). La resolution
# d'un kill fait weapon_id -> weapon_ids -> weapon_key -> {en, fr} depuis ce fichier
# (cf. internal/platform/duckdb/weapon_resolver.go).
#
# RExGLE : une entree par weapon_key present dans le registre (garde-rail de
# completude : weapon_names_completeness_test.go). en ET fr obligatoires ; si aucun
# FR officiel n'est connu, mettre le EN dans les deux (jamais de FR invente).
#
# FR = localisation officielle confirmee (ex-asset_labels_fr.toml [weapons],
# wiki.halo.fr) quand elle existe, sinon le FR du registre. Trous connus corriges :
# "FRAG GRENADE" -> "Grenade à fragmentation", "LightRifle" -> "Fusil léger",
# "Spartan" (bucket non attribue) -> "Non attribué".

[meta]
title_slug     = "halo_5"
schema_version = 1

[weapons]
