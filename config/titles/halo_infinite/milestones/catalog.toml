# Halo Infinite milestone catalog.
#
# English fields are required by the active ingestion pipeline.
# Legacy database columns may mirror these values during upgrades.
#

[meta]
schema_version = 1
title_slug = "halo_infinite"

# ─── Volume : matchs joués ─────────────────────────────────────────────────

[[milestones]]
id        = "halo_infinite.matches.100"
metric    = "matches_played"
threshold = 100
title_en  = "Centurion"
icon      = "milestone_matches_100"

[[milestones]]
id        = "halo_infinite.matches.500"
metric    = "matches_played"
threshold = 500
title_en  = "Veteran"
icon      = "milestone_matches_500"

[[milestones]]
id        = "halo_infinite.matches.1000"
metric    = "matches_played"
threshold = 1000
title_en  = "Elite Spartan"
icon      = "milestone_matches_1000"

